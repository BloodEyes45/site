        tailwind.config = {
            darkMode: 'class',
        }

    <!-- Firebase SDK'ları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQR3SoBD0fygIJT3PRudDQ-2XjuphOHKE",
            authDomain: "semaasistan-9dca3.firebaseapp.com",
            databaseURL: "https://semaasistan-9dca3-default-rtdb.firebaseio.com",
            projectId: "semaasistan-9dca3",
            storageBucket: "semaasistan-9dca3.firebasestorage.app",
            messagingSenderId: "132361761020",
            appId: "1:132361761020:web:f41854b563182ca44ce779",
            measurementId: "G-E8NYQYPCNR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.fbDB = { db, ref, set, onValue };
        if(window.initWhiteboardListeners) window.initWhiteboardListeners();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        canvas { touch-action: none; }
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(236, 72, 153, 0.08) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(236, 72, 153, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-80px) scale(1.2) rotate(10deg); opacity: 0.8; }
            100% { transform: translateY(-160px) scale(1.4) rotate(-10deg); opacity: 0; }
        }
        .floating-heart {
            position: absolute;
            animation: floatUp 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(236, 72, 153, 0.3));
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-24 transition-colors duration-300">

    <!-- Üst Başlık -->
    <header class="glass-panel border-b border-slate-200/80 dark:border-slate-800/80 sticky top-0 z-40 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-heart text-pink-500 animate-pulse"></i>SemaAsistan Stüdyo
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="w-9 h-9 rounded-2xl bg-slate-200/70 dark:bg-slate-800/70 border border-slate-300/60 dark:border-slate-700/60 flex items-center justify-center text-slate-700 dark:text-slate-300 transition-all active:scale-95 shadow-sm">
                    <i id="themeIcon" class="fa-solid fa-sun text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- İçerik Alanı: Sadece Canlı Çizim Stüdyosu -->
    <main class="max-w-md mx-auto px-4 mt-4 space-y-3">
        
        <section id="tab-draw" class="space-y-3 animate-fade-in">
            <div class="flex justify-between items-center px-1">
                <div class="flex items-center gap-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 text-pink-500">
                        <i class="fa-solid fa-paintbrush"></i> Ortak Canlı Stüdyo
                    </h2>
                    <span id="userColorBadge" class="w-4 h-4 rounded-full bg-pink-500 border-2 border-white dark:border-slate-900 shadow-md inline-block transition-transform duration-300 scale-100" title="Aktif Çizim Renginiz"></span>
                </div>
                <div class="flex gap-1.5">
                    <button onclick="triggerHeartPartyFirebase()" class="bg-pink-500/15 hover:bg-pink-500/25 text-pink-500 border border-pink-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition-all active:scale-95 shadow-sm flex items-center gap-1" title="Ortak Kalp Yağmuru">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                    <button onclick="downloadCanvasPNG()" class="bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-500 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition-all active:scale-95 shadow-sm flex items-center gap-1" title="Resmi İndir">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button onclick="clearCanvasFirebase()" class="bg-red-500/15 hover:bg-red-500/25 text-red-500 border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition-all active:scale-95 shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- Araç Çubuğu 1: Çizim Araçları ve Şekiller (Yenilendi) -->
            <div class="glass-panel border border-slate-200 dark:border-slate-800 rounded-2xl p-2.5 shadow-md flex flex-wrap gap-1 items-center justify-between text-xs">
                <div class="flex gap-1 flex-wrap">
                    <button onclick="setTool('pen')" id="tool-pen" class="px-2.5 py-1.5 rounded-xl font-bold bg-pink-600 text-white transition-all shadow-sm active:scale-95" title="Serbest Kalem"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="setTool('highlighter')" id="tool-highlighter" class="px-2.5 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition-all active:scale-95" title="Fosforlu Kalem"><i class="fa-solid fa-highlighter"></i></button>
                    <button onclick="setTool('line')" id="tool-line" class="px-2.5 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition-all active:scale-95" title="Düz Çizgi"><i class="fa-solid fa-slash"></i></button>
                    <button onclick="setTool('arrow')" id="tool-arrow" class="px-2.5 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition-all active:scale-95" title="Ok İşareti"><i class="fa-solid fa-arrow-right"></i></button>
                    <button onclick="setTool('rect')" id="tool-rect" class="px-2.5 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition-all active:scale-95" title="Kutu Çerçeve"><i class="fa-regular fa-square"></i></button>
                    <button onclick="setTool('circle')" id="tool-circle" class="px-2.5 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition-all active:scale-95" title="Daire Çerçeve"><i class="fa-regular fa-circle"></i></button>
                    <button onclick="setTool('eraser')" id="tool-eraser" class="px-2.5 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition-all active:scale-95" title="Silgi"><i class="fa-solid fa-eraser"></i></button>
                </div>
                <div class="flex gap-1">
                    <button onclick="undoCanvas()" class="px-2.5 py-1.5 rounded-xl bg-slate-200/60 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 active:scale-95 transition-all shadow-sm" title="Son İşlemi Geri Al"><i class="fa-solid fa-rotate-left"></i></button>
                </div>
            </div>

            <!-- Araç Çubuğu 2: Renkler, Son Kullanılanlar & Dinamik Kalınlık Önizlemesi -->
            <div class="glass-panel border border-slate-200 dark:border-slate-800 rounded-2xl p-3 shadow-md space-y-2.5">
                <!-- Sabit Renkler ve Özel Seçici -->
                <div class="flex items-center justify-between flex-wrap gap-1.5">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <button onclick="setDrawColor('#ec4899')" class="w-6 h-6 rounded-full bg-pink-500 border-2 border-white dark:border-slate-800 shadow hover:scale-110 transition-transform"></button>
                        <button onclick="setDrawColor('#8b5cf6')" class="w-6 h-6 rounded-full bg-purple-500 border-2 border-white dark:border-slate-800 shadow hover:scale-110 transition-transform"></button>
                        <button onclick="setDrawColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white dark:border-slate-800 shadow hover:scale-110 transition-transform"></button>
                        <button onclick="setDrawColor('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white dark:border-slate-800 shadow hover:scale-110 transition-transform"></button>
                        <button onclick="setDrawColor('#eab308')" class="w-6 h-6 rounded-full bg-yellow-500 border-2 border-white dark:border-slate-800 shadow hover:scale-110 transition-transform"></button>
                        <button onclick="setDrawColor('#f97316')" class="w-6 h-6 rounded-full bg-orange-500 border-2 border-white dark:border-slate-800 shadow hover:scale-110 transition-transform"></button>
                        <button onclick="setDrawColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white dark:border-slate-800 shadow hover:scale-110 transition-transform"></button>
                        <button onclick="setDrawColor('#0f172a')" class="w-6 h-6 rounded-full bg-slate-900 dark:bg-white border-2 border-slate-300 shadow hover:scale-110 transition-transform"></button>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="color" id="customColorPicker" onchange="setDrawColor(this.value)" value="#ec4899" class="w-7 h-7 rounded-xl border-0 cursor-pointer bg-transparent" title="Özel Renk Seç">
                    </div>
                </div>

                <!-- Son Kullanılan Renkler Geçmişi -->
                <div class="flex items-center gap-2 pt-1 border-t border-slate-200/60 dark:border-slate-800/60">
                    <span class="text-[10px] font-semibold opacity-60">Son Renkler:</span>
                    <div id="recentColorsContainer" class="flex gap-1.5 items-center"></div>
                </div>

                <!-- Fırça Kalınlığı ve Canlı Önizleme -->
                <div class="flex items-center justify-between pt-1 border-t border-slate-200/60 dark:border-slate-800/60 text-xs">
                    <span class="text-[10px] font-semibold opacity-60">Fırça Kalınlığı:</span>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center justify-center w-8 h-8 bg-slate-200/60 dark:bg-slate-800 rounded-full border border-slate-300 dark:border-slate-700 shadow-inner">
                            <div id="brushPreviewCircle" class="rounded-full bg-pink-500 transition-all duration-150" style="width: 4px; height: 4px;"></div>
                        </div>
                        <input type="range" id="brushSize" min="2" max="36" value="4" oninput="updateBrushPreview(this.value)" class="w-28 accent-pink-600 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Arka Plan Seçimi -->
            <div class="flex justify-between items-center px-1 text-xs opacity-80">
                <span class="font-medium">Tuval Stili:</span>
                <div class="flex gap-3">
                    <button onclick="setCanvasBg('plain')" id="bgBtnPlain" class="underline font-bold text-pink-500 transition-all">Düz</button>
                    <button onclick="setCanvasBg('grid')" id="bgBtnGrid" class="hover:text-pink-500 transition-all">Kareli Defter</button>
                </div>
            </div>

            <!-- Tuval Alanı (Yükseklik 500px) -->
            <div id="canvasContainer" class="relative glass-panel border border-slate-200 dark:border-slate-800 rounded-2xl p-2 shadow-xl overflow-hidden flex justify-center transition-colors duration-300">
                <canvas id="whiteboardCanvas" width="350" height="500" class="bg-slate-50 dark:bg-slate-900 rounded-xl cursor-crosshair border border-slate-200/80 dark:border-slate-800/80 shadow-inner"></canvas>
            </div>
        </section>

    <!-- JavaScript Gelişmiş Çizim Motoru -->
    <script>
        let currentTab = 'draw';
        let recentColors = ['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#eab308'];

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark'); html.classList.add('light');
                icon.className = "fa-solid fa-moon text-xs";
            } else {
                html.classList.remove('light'); html.classList.add('dark');
                icon.className = "fa-solid fa-sun text-xs";
            }
        }

        // --- GELİŞMİŞ ÇİZİM STÜDYOSU MOTORU ---
        let canvas, ctx, isDrawing = false, drawColor = '#ec4899', currentTool = 'pen', startX = 0, startY = 0;
        let snapshotData = null; // Şekil önizlemesi için anlık görüntü

        function initWhiteboard() {
            canvas = document.getElementById('whiteboardCanvas');
            if(!canvas) return;
            ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            canvas.onmousedown = startAction;
            canvas.onmousemove = moveAction;
            canvas.onmouseup = endAction;
            canvas.onmouseleave = endAction;

            canvas.ontouchstart = (e) => { startAction(e.touches[0]); e.preventDefault(); };
            canvas.ontouchmove = (e) => { moveAction(e.touches[0]); e.preventDefault(); };
            canvas.ontouchend = endAction;

            renderRecentColors();
            updateBrushPreview(document.getElementById('brushSize').value);
            if(window.fbDB) initWhiteboardListeners();
        }

        function setTool(tool) {
            currentTool = tool;
            ['pen', 'highlighter', 'line', 'arrow', 'rect', 'circle', 'eraser'].forEach(t => {
                const btn = document.getElementById(`tool-${t}`);
                if(btn) {
                    btn.className = t === tool ? "px-2.5 py-1.5 rounded-xl font-bold bg-pink-600 text-white transition-all shadow-md active:scale-95" : "px-2.5 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition-all active:scale-95";
                }
            });
            updateBrushPreview(document.getElementById('brushSize').value);
        }

        function setDrawColor(col) {
            drawColor = col;
            document.getElementById('customColorPicker').value = col;
            const badge = document.getElementById('userColorBadge');
            badge.style.backgroundColor = col;
            badge.classList.add('scale-125');
            setTimeout(() => badge.classList.remove('scale-125'), 200);

            document.getElementById('brushPreviewCircle').style.backgroundColor = col;
            if(currentTool === 'eraser') setTool('pen');

            // Son renkler listesine ekle (en fazla 5 renk)
            if(!recentColors.includes(col)) {
                recentColors.unshift(col);
                if(recentColors.length > 5) recentColors.pop();
                renderRecentColors();
            }
        }

        function renderRecentColors() {
            const container = document.getElementById('recentColorsContainer');
            if(!container) return;
            container.innerHTML = recentColors.map(c => `
                <button onclick="setDrawColor('${c}')" class="w-5 h-5 rounded-full border-2 border-white dark:border-slate-800 shadow-sm transition-transform hover:scale-110 active:scale-95" style="background-color: ${c};"></button>
            `).join('');
        }

        function updateBrushPreview(val) {
            const preview = document.getElementById('brushPreviewCircle');
            const size = Math.min(val, 28);
            preview.style.width = size + 'px';
            preview.style.height = size + 'px';
            preview.style.backgroundColor = currentTool === 'eraser' ? '#94a3b8' : drawColor;
        }

        function setCanvasBg(type) {
            const container = document.getElementById('canvasContainer');
            const btnPlain = document.getElementById('bgBtnPlain');
            const btnGrid = document.getElementById('bgBtnGrid');
            if(type === 'grid') {
                container.classList.add('bg-grid-pattern');
                btnGrid.className = "underline font-bold text-pink-500 transition-all";
                btnPlain.className = "hover:text-pink-500 transition-all";
            } else {
                container.classList.remove('bg-grid-pattern');
                btnPlain.className = "underline font-bold text-pink-500 transition-all";
                btnGrid.className = "hover:text-pink-500 transition-all";
            }
        }

        function startAction(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            if(['pen', 'highlighter', 'eraser'].includes(currentTool)) {
                lastX = startX; lastY = startY;
            } else {
                // Şekiller, çizgi ve ok için tuvalin o anki halini sakla (canlı önizleme için)
                snapshotData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
        }

        let lastX = 0, lastY = 0;
        function moveAction(e) {
            if(!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const size = document.getElementById('brushSize').value;

            if(['pen', 'highlighter', 'eraser'].includes(currentTool)) {
                let color = drawColor;
                let isHighlighter = false;
                if(currentTool === 'eraser') color = document.documentElement.classList.contains('dark') ? '#0f172a' : '#f8fafc';
                if(currentTool === 'highlighter') isHighlighter = true;

                drawLineLocally(lastX, lastY, x, y, color, size, isHighlighter);

                if(window.fbDB) {
                    const { db, ref, set } = window.fbDB;
                    const id = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                    set(ref(db, 'whiteboard/items/' + id), { type: currentTool, x1: lastX, y1: lastY, x2: x, y2: y, color, size });
                }
                lastX = x; lastY = y;
            } else if(['line', 'arrow', 'rect', 'circle'].includes(currentTool)) {
                // Canlı şekil önizlemesi (Sürüklerken anlık çizim)
                ctx.putImageData(snapshotData, 0, 0);
                drawShapeLocally(currentTool, startX, startY, x, y, drawColor, size);
            }
        }

        function endAction(e) {
            if(!isDrawing) return;
            isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            const x = e.changedTouches ? e.changedTouches[0].clientX - rect.left : e.clientX - rect.left;
            const y = e.changedTouches ? e.changedTouches[0].clientY - rect.top : e.clientY - rect.top;
            const size = document.getElementById('brushSize').value;

            if(['line', 'arrow', 'rect', 'circle'].includes(currentTool)) {
                // Önizlemeyi geri yükle ve son kalıcı çizimi yapıp Firebase'e gönder
                if(snapshotData) ctx.putImageData(snapshotData, 0, 0);
                drawShapeLocally(currentTool, startX, startY, x, y, drawColor, size);
                if(window.fbDB) {
                    const { db, ref, set } = window.fbDB;
                    const id = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                    set(ref(db, 'whiteboard/items/' + id), { type: currentTool, x1: startX, y1: startY, x2: x, y2: y, color: drawColor, size });
                }
            }
        }

        function drawLineLocally(x1, y1, x2, y2, color, size, isHighlighter = false) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = size;
            if(isHighlighter) {
                ctx.globalAlpha = 0.35;
                ctx.lineWidth = Math.max(size, 16);
            } else {
                ctx.globalAlpha = 1.0;
            }
            ctx.stroke();
            ctx.closePath();
            ctx.globalAlpha = 1.0;
        }

        function drawShapeLocally(type, x1, y1, x2, y2, color, size) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = size;

            if(type === 'line') {
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            } else if(type === 'arrow') {
                // Düz çizgi ve uç kısmına ok başı
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                const angle = Math.atan2(y2 - y1, x2 - x1);
                const headLen = Math.max(12, size * 2.5);
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
                ctx.lineTo(x2, y2);
                ctx.fill();
            } else if(type === 'rect') {
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
            } else if(type === 'circle') {
                let radius = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                ctx.arc(x1, y1, radius, 0, 2 * Math.PI);
                ctx.stroke();
            }
            ctx.closePath();
        }

        window.initWhiteboardListeners = function() {
            if(!window.fbDB) return;
            const { db, ref, onValue } = window.fbDB;

            // Çizimleri dinle
            onValue(ref(db, 'whiteboard/items'), (snapshot) => {
                const data = snapshot.val();
                if(ctx && canvas) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if(data) {
                        Object.values(data).forEach(item => {
                            if(['pen', 'eraser'].includes(item.type)) {
                                drawLineLocally(item.x1, item.y1, item.x2, item.y2, item.color, item.size, false);
                            } else if(item.type === 'highlighter') {
                                drawLineLocally(item.x1, item.y1, item.x2, item.y2, item.color, item.size, true);
                            } else if(['line', 'arrow', 'rect', 'circle'].includes(item.type)) {
                                drawShapeLocally(item.type, item.x1, item.y1, item.x2, item.y2, item.color, item.size);
                            }
                        });
                    }
                }
            });

            // Temizlemeyi dinle
            onValue(ref(db, 'whiteboard/clear'), (snapshot) => {
                if(snapshot.val() && ctx && canvas) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            });

            // Senkronize Kalp Yağmurunu Dinle
            onValue(ref(db, 'whiteboard/heartParty'), (snapshot) => {
                if(snapshot.val()) {
                    playFloatingHeartsAnimation();
                }
            });
        };

        function clearCanvasFirebase() {
            if(window.fbDB) {
                const { db, ref, set } = window.fbDB;
                set(ref(db, 'whiteboard/items'), null);
                set(ref(db, 'whiteboard/clear'), true);
                setTimeout(() => set(ref(db, 'whiteboard/clear'), false), 500);
            }
        }

        function undoCanvas() {
            if(window.fbDB) {
                const { db, ref, onValue, set } = window.fbDB;
                onValue(ref(db, 'whiteboard/items'), (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        const keys = Object.keys(data);
                        if(keys.length > 0) {
                            set(ref(db, 'whiteboard/items/' + keys[keys.length - 1]), null);
                        }
                    }
                }, { onlyOnce: true });
            }
        }

        function triggerHeartPartyFirebase() {
            if(window.fbDB) {
                const { db, ref, set } = window.fbDB;
                set(ref(db, 'whiteboard/heartParty'), true);
                setTimeout(() => set(ref(db, 'whiteboard/heartParty'), false), 500);
            }
        }

        function playFloatingHeartsAnimation() {
            const container = document.getElementById('canvasContainer');
            if(!container) return;
            for(let i = 0; i < 12; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-pink-500 text-2xl';
                heart.innerHTML = i % 2 === 0 ? '❤️' : '💖';
                heart.style.left = Math.random() * 80 + 10 + '%';
                heart.style.bottom = '20px';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 2000);
            }
        }

        function downloadCanvasPNG() {
            const link = document.createElement('a');
            link.download = 'SemaAsistan_OrtakCalisma.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Başlangıçta tuval motorunu başlat
        initWhiteboard();
    </script>
</body>
</html>
