<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SemaAsistan</title>
    
    <!-- Sevimli Kalp İkonu -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/6723/6723246.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-28 transition-colors duration-300">

    <!-- Üst Başlık -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-heart text-pink-500"></i>SemaAsistan
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="w-8 h-8 rounded-xl bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-300 transition">
                    <i id="themeIcon" class="fa-solid fa-sun text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- İçerik Alanı -->
    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">
        
        <!-- 1. ÖZET / ANA SAYFA SEKMESİ -->
        <section id="tab-home" class="space-y-4">
            <div class="grid grid-cols-1 gap-3">
                <div class="bg-gradient-to-br from-pink-600 to-purple-700 rounded-2xl p-5 text-white shadow-xl shadow-pink-600/20 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold mb-1">Hoş Geldin Sema! 👋</h2>
                        <p id="welcomeDate" class="text-xs text-pink-100 opacity-90">Yükleniyor...</p>
                    </div>
                    <!-- Hava Durumu Kartı -->
                    <div id="weatherWidget" class="bg-white/15 backdrop-blur-md border border-white/20 rounded-2xl p-3 text-center min-w-[90px]">
                        <i id="weatherIcon" class="fa-solid fa-cloud-sun text-xl mb-1"></i>
                        <div id="weatherTemp" class="text-sm font-bold">--°C</div>
                        <div id="weatherDesc" class="text-[10px] opacity-90">Hava</div>
                    </div>
                </div>
            </div>

            <!-- Canlı Ders Sayaç Kartı -->
            <div id="countdownCard" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm text-center">
                <h4 class="text-xs font-bold uppercase tracking-wider opacity-60 mb-1">Ders Durumu</h4>
                <div id="countdownText" class="text-sm font-bold text-pink-500">Hesaplanıyor...</div>
            </div>

            <div class="space-y-3">
                <h3 class="text-xs font-bold uppercase tracking-wider opacity-60">Bugünün Özeti</h3>
                <div id="todaySummaryList" class="space-y-2"></div>
            </div>
        </section>

        <!-- 2. DERS PROGRAMI SEKMESİ -->
        <section id="tab-schedule" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold">Ders Programı & Devamsızlık</h2>
                <button onclick="openModal('lesson')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Ders Ekle
                </button>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar" id="dayTabs"></div>
            <div id="lessonsList" class="space-y-3"></div>
        </section>

        <!-- 3. ALIŞKANLIKLAR SEKMESİ -->
        <section id="tab-habits" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold">Günlük Alışkanlıklar & Rutinler</h2>
                <button onclick="openModal('habit')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Rutin Ekle
                </button>
            </div>
            <div id="habitsList" class="space-y-3"></div>
        </section>

        <!-- 4. NOTLAR SEKMESİ -->
        <section id="tab-notes" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold">Hızlı Notlar</h2>
                <button onclick="openModal('note')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Not Ekle
                </button>
            </div>
            <div id="notesList" class="space-y-3"></div>
        </section>

        <!-- 5. ÖDEVLER VE SINAVLAR SEKMESİ -->
        <section id="tab-todos" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold">Ödevler & Sınavlar</h2>
                <button onclick="openModal('todo')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Görev Ekle
                </button>
            </div>
            <div id="todosList" class="space-y-3"></div>
        </section>

        <!-- 6. ORTALAMA HESAPLAMA SEKMESİ -->
        <section id="tab-calc" class="space-y-4 hidden">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-md space-y-3">
                <h2 class="text-sm font-bold">Akıllı Geçme Notu & AGNO Hesapla</h2>
                <div>
                    <label class="block text-[10px] font-medium opacity-60 mb-1">VİZE NOTU</label>
                    <input type="number" id="vizeNot" placeholder="Örn: 70" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs focus:outline-none focus:border-pink-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-medium opacity-60 mb-1">VİZE ETKİSİ (%)</label>
                        <input type="number" id="vizeOran" value="40" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium opacity-60 mb-1">GEÇME NOTU (Ağırlıklı)</label>
                        <input type="number" id="gecmeNotu" value="50" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2.5 text-xs">
                    </div>
                </div>
                <button onclick="calculatePassingScore()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-medium py-2.5 rounded-xl text-xs transition shadow-lg shadow-pink-600/30">Finalden Kaç Almalıyım?</button>
                <div id="calcResult" class="text-center pt-2 text-xs font-bold text-pink-400 space-y-1"></div>
            </div>
        </section>

    </main>

    <!-- Alt Navigasyon Çubuğu -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 py-2 px-1 z-40">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-pink-500 transition">
                <i class="fa-solid fa-house text-sm"></i><span class="text-[9px] font-medium">Özet</span>
            </button>
            <button onclick="switchTab('schedule')" id="nav-schedule" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-calendar-days text-sm"></i><span class="text-[9px] font-medium">Dersler</span>
            </button>
            <button onclick="switchTab('habits')" id="nav-habits" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-bolt text-sm"></i><span class="text-[9px] font-medium">Rutin</span>
            </button>
            <button onclick="switchTab('notes')" id="nav-notes" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-note-sticky text-sm"></i><span class="text-[9px] font-medium">Notlar</span>
            </button>
            <button onclick="switchTab('todos')" id="nav-todos" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-list-check text-sm"></i><span class="text-[9px] font-medium">Görev</span>
            </button>
            <button onclick="switchTab('calc')" id="nav-calc" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-calculator text-sm"></i><span class="text-[9px] font-medium">Hesapla</span>
            </button>
        </div>
    </nav>

    <!-- Modal Pencere -->
    <div id="globalModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl text-slate-900 dark:text-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-sm font-bold">Yeni Kayıt</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form id="dynamicForm" onsubmit="handleFormSubmit(event)" class="space-y-3"></form>
        </div>
    </div>

    <!-- JavaScript Mantığı -->
    <script>
        const days = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
        let dateToday = new Date().getDay();
        let currentDayIndex = dateToday === 0 ? 6 : dateToday - 1;
        let selectedDay = days[currentDayIndex];
        let currentTab = 'home';
        let activeModalType = '';
        let editingLessonId = null;

        const defaultLessons = {
            "Pazartesi": [
                { id: 101, name: "Yaşlıda Akut ve Kronik Hastalıklar", start: "09:00", end: "12:30", room: "Derslik 7", absence: 0 },
                { id: 102, name: "Sağlık Sosyolojisi", start: "13:30", end: "15:10", room: "Derslik 3", absence: 0 }
            ],
            "Salı": [
                { id: 201, name: "Yaşlıda Beslenme", start: "09:00", end: "10:40", room: "Derslik 3", absence: 0 },
                { id: 202, name: "Fiziksel Rehabilitasyon", start: "10:50", end: "12:30", room: "Derslik 6", absence: 0 },
                { id: 203, name: "Geriatrik Psikiyatri", start: "13:30", end: "15:10", room: "Derslik 6", absence: 0 },
                { id: 204, name: "Sağlık İşletmelerinde Yönetim", start: "15:20", end: "17:00", room: "Amfi C", absence: 0 }
            ],
            "Çarşamba": [
                { id: 301, name: "Çevre Koruma", start: "09:00", end: "10:40", room: "Amfi C", absence: 0 },
                { id: 302, name: "Yaşlıda Akut ve Kronik Hastalıklar", start: "10:50", end: "12:30", room: "Amfi C", absence: 0 }
            ],
            "Perşembe": [], "Cuma": [], "Cumartesi": [], "Pazar": []
        };

        let db = JSON.parse(localStorage.getItem('sema_asistan_db_v7')) || {
            lessons: defaultLessons,
            habits: [
                { id: 1, name: "Su İç (2 Litre)", completed: false },
                { id: 2, name: "Günlük Tekrar Yap", completed: false }
            ],
            notes: [],
            todos: []
        };

        function saveData() {
            localStorage.setItem('sema_asistan_db_v7', JSON.stringify(db));
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = "fa-solid fa-moon text-xs";
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun text-xs";
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['home', 'schedule', 'habits', 'notes', 'todos', 'calc'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).className = "flex flex-col items-center gap-1 text-pink-500 transition";
            renderCurrentView();
        }

        function renderCurrentView() {
            if (currentTab === 'home') { renderHome(); fetchWeather(); updateCountdown(); }
            if (currentTab === 'schedule') { renderDays(); renderLessons(); }
            if (currentTab === 'habits') renderHabits();
            if (currentTab === 'notes') renderNotes();
            if (currentTab === 'todos') renderTodos();
        }

        function updateCountdown() {
            const now = new Date();
            const todayName = days[currentDayIndex];
            const todayLessons = db.lessons[todayName] || [];
            
            const curMinutes = now.getHours() * 60 + now.getMinutes();
            let nextLesson = null;
            let currentLesson = null;

            todayLessons.forEach(l => {
                const [sH, sM] = l.start.split(':').map(Number);
                const [eH, eM] = l.end.split(':').map(Number);
                const sMin = sH * 60 + sM;
                const eMin = eH * 60 + eM;

                if (curMinutes >= sMin && curMinutes <= eMin) {
                    currentLesson = l;
                } else if (sMin > curMinutes && (!nextLesson || sMin < (parseInt(nextLesson.start.split(':')[0])*60 + parseInt(nextLesson.start.split(':')[1])))) {
                    nextLesson = l;
                }
            });

            const textEl = document.getElementById('countdownText');
            if (currentLesson) {
                textEl.innerHTML = `Şu an derste: <strong class="text-pink-500">${currentLesson.name}</strong> (${currentLesson.room || ''})`;
            } else if (nextLesson) {
                const [sH, sM] = nextLesson.start.split(':').map(Number);
                const diff = (sH * 60 + sM) - curMinutes;
                const saat = Math.floor(diff / 60);
                const dakika = diff % 60;
                let zamanStr = saat > 0 ? `${saat} saat ${dakika} dk` : `${dakika} dakika`;
                textEl.innerHTML = `Sıradaki Ders: <strong class="text-pink-500">${nextLesson.name}</strong> (${zamanStr} kaldı)`;
            } else {
                textEl.innerHTML = `Bugün başka ders kalmadı! Dinlenme vakti ✨`;
            }
        }

        async function fetchWeather() {
            try {
                let lat = 39.1903, lon = 27.6156;
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        getWeatherData(pos.coords.latitude, pos.coords.longitude);
                    }, () => getWeatherData(lat, lon));
                } else { getWeatherData(lat, lon); }
            } catch (e) {
                document.getElementById('weatherTemp').innerText = "22°C";
                document.getElementById('weatherDesc').innerText = "Açık";
            }
        }

        async function getWeatherData(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await res.json();
                document.getElementById('weatherTemp').innerText = `${Math.round(data.current_weather.temperature)}°C`;
                document.getElementById('weatherDesc').innerText = "Güneşli";
            } catch (e) {
                document.getElementById('weatherTemp').innerText = "20°C";
                document.getElementById('weatherDesc').innerText = "Normal";
            }
        }

        function renderHome() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('welcomeDate').innerText = new Date().toLocaleDateString('tr-TR', options);
            
            const container = document.getElementById('todaySummaryList');
            const todayName = days[currentDayIndex];
            const todayLessons = db.lessons[todayName] || [];
            
            let html = '';
            if (todayLessons.length === 0) {
                html += `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-center text-xs opacity-60">Bugün planlanmış ders bulunmuyor. Harika gün! 🎉</div>`;
            } else {
                todayLessons.forEach(item => {
                    html += `
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex justify-between items-center shadow-sm">
                            <div>
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-pink-500/10 text-pink-500 border border-pink-500/20">${item.start} - ${item.end}</span>
                                <h4 class="text-sm font-bold mt-1">${item.name}</h4>
                            </div>
                            ${item.room ? `<span class="text-[10px] opacity-60"><i class="fa-solid fa-location-dot mr-1"></i>${item.room}</span>` : ''}
                        </div>`;
                });
            }
            container.innerHTML = html;
        }

        function renderDays() {
            const container = document.getElementById('dayTabs');
            container.innerHTML = '';
            days.forEach(day => {
                const isActive = day === selectedDay;
                container.innerHTML += `
                    <button onclick="selectDay('${day}')" class="px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition ${isActive ? 'bg-pink-600 text-white shadow-lg shadow-pink-600/30' : 'bg-white dark:bg-slate-900 opacity-70 border border-slate-200 dark:border-slate-800'}">
                        ${day}
                    </button>`;
            });
        }

        function selectDay(day) { selectedDay = day; renderDays(); renderLessons(); }

        function renderLessons() {
            const container = document.getElementById('lessonsList');
            const list = db.lessons[selectedDay] || [];
            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-50 text-xs"><i class="fa-regular fa-calendar-xmark text-3xl mb-2"></i><p>Bu gün ders yok.</p></div>`;
                return;
            }
            list.sort((a, b) => a.start.localeCompare(b.start));
            container.innerHTML = '';
            list.forEach(item => {
                const abs = item.absence || 0;
                // 5 devamsızlık sınırı kontrolü (5 ve üzeri tehlike)
                const isDanger = abs >= 5;
                const cardBorder = isDanger ? 'border-red-500/50 bg-red-500/5' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800';

                container.innerHTML += `
                    <div class="${cardBorder} border rounded-2xl p-3.5 shadow-sm space-y-2 transition-colors">
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-pink-500/10 text-pink-500 border border-pink-500/20">${item.start} - ${item.end}</span>
                                <h3 class="text-sm font-bold mt-1">${item.name}</h3>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="openModal('lesson', ${item.id})" class="opacity-60 hover:text-pink-500 p-2"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteItem('lessons', ${item.id})" class="opacity-50 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-200 dark:border-slate-800 text-[11px]">
                            <span class="opacity-80">
                                <i class="fa-solid fa-user-xmark mr-1"></i>Devamsızlık: <strong class="${isDanger ? 'text-red-500 font-bold' : 'text-pink-500'}">${abs} / 5</strong>
                                ${isDanger ? '<span class="text-[9px] text-red-500 font-bold ml-1">(Sınır Aşıldı!) ⚠️</span>' : ''}
                            </span>
                            <div class="flex gap-1">
                                <button onclick="updateAbsence(${item.id}, -1)" class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center">-</button>
                                <button onclick="updateAbsence(${item.id}, 1)" class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center">+</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function updateAbsence(id, val) {
            const item = db.lessons[selectedDay].find(x => x.id === id);
            if (item) {
                item.absence = Math.max(0, (item.absence || 0) + val);
                saveData();
                renderLessons();
            }
        }

        function renderHabits() {
            const container = document.getElementById('habitsList');
            if (db.habits.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-50 text-xs">Rutin bulunmuyor.</div>`;
                return;
            }
            container.innerHTML = '';
            db.habits.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${item.completed ? 'checked' : ''} onclick="toggleHabit(${item.id})" class="w-4 h-4 accent-pink-600 rounded">
                            <span class="text-sm font-bold ${item.completed ? 'line-through opacity-40' : ''}">${item.name}</span>
                        </div>
                        <button onclick="deleteItem('habits', ${item.id})" class="opacity-50 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>`;
            });
        }

        function renderNotes() {
            const container = document.getElementById('notesList');
            if (db.notes.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-50 text-xs"><p>Not bulunmuyor.</p></div>`;
                return;
            }
            container.innerHTML = '';
            db.notes.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-1">
                        <div class="flex justify-between items-start">
                            <h3 class="text-sm font-bold">${item.title}</h3>
                            <button onclick="deleteItem('notes', ${item.id})" class="opacity-50 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                        <p class="text-xs opacity-80 whitespace-pre-line">${item.content}</p>
                    </div>`;
            });
        }

        function renderTodos() {
            const container = document.getElementById('todosList');
            if (db.todos.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-50 text-xs"><p>Görev bulunmuyor.</p></div>`;
                return;
            }
            container.innerHTML = '';
            db.todos.forEach(item => {
                // Öncelik rozeti rengi
                let badgeColor = 'bg-blue-500/10 text-blue-500 border-blue-500/20';
                if (item.priority === 'Sınav') badgeColor = 'bg-red-500/10 text-red-500 border-red-500/20';
                else if (item.priority === 'Ödev') badgeColor = 'bg-purple-500/10 text-purple-500 border-purple-500/20';

                container.innerHTML += `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${item.completed ? 'checked' : ''} onclick="toggleTodo(${item.id})" class="w-4 h-4 accent-pink-600 rounded">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="text-[9px] font-bold px-2 py-0.5 rounded-md border ${badgeColor}">${item.priority || 'Görev'}</span>
                                    <h3 class="text-sm font-bold ${item.completed ? 'line-through opacity-40' : ''}">${item.title}</h3>
                                </div>
                                <span class="text-[10px] opacity-65">Son Tarih: ${item.date || 'Belirtilmedi'}</span>
                            </div>
                        </div>
                        <button onclick="deleteItem('todos', ${item.id})" class="opacity-50 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>`;
            });
        }

        function openModal(type, id = null) {
            activeModalType = type;
            editingLessonId = id;
            document.getElementById('globalModal').classList.remove('hidden');
            const form = document.getElementById('dynamicForm');
            
            if (type === 'lesson') {
                let lesson = null;
                if (id) {
                    lesson = db.lessons[selectedDay].find(x => x.id === id);
                }
                document.getElementById('modalTitle').innerText = id ? 'Dersi Düzenle' : 'Yeni Ders Ekle';
                form.innerHTML = `
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">GÜN</label><select id="fDay" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs">${days.map(d=>`<option ${d===selectedDay?'selected':''}>${d}</option>`).join('')}</select></div>
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">DERS ADI</label><input type="text" id="fName" value="${lesson ? lesson.name : ''}" required placeholder="Matematik" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-[10px] font-medium opacity-60 mb-1">BAŞLANGIÇ</label><input type="time" id="fStart" value="${lesson ? lesson.start : ''}" required class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></div>
                        <div><label class="block text-[10px] font-medium opacity-60 mb-1">BİTİŞ</label><input type="time" id="fEnd" value="${lesson ? lesson.end : ''}" required class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></div>
                    </div>
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">DERSLİK</label><input type="text" id="fRoom" value="${lesson ? (lesson.room || '') : ''}" placeholder="Derslik 7" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></div>
                    <button type="submit" class="w-full bg-pink-600 text-white font-medium py-2 rounded-xl text-xs transition mt-2">Kaydet</button>`;
            } else if (type === 'habit') {
                document.getElementById('modalTitle').innerText = 'Yeni Rutin Ekle';
                form.innerHTML = `
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">RUTİN ADI</label><input type="text" id="hName" required placeholder="Erken Uyu" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></div>
                    <button type="submit" class="w-full bg-pink-600 text-white font-medium py-2 rounded-xl text-xs transition mt-2">Kaydet</button>`;
            } else if (type === 'note') {
                document.getElementById('modalTitle').innerText = 'Yeni Not Ekle';
                form.innerHTML = `
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">BAŞLIK</label><input type="text" id="nTitle" required placeholder="Başlık" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></div>
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">İÇERİK</label><textarea id="nContent" rows="3" required placeholder="İçerik..." class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></textarea></div>
                    <button type="submit" class="w-full bg-pink-600 text-white font-medium py-2 rounded-xl text-xs transition mt-2">Kaydet</button>`;
            } else if (type === 'todo') {
                document.getElementById('modalTitle').innerText = 'Görev veya Sınav Ekle';
                form.innerHTML = `
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">TÜR / ÖNCELİK</label><select id="tPriority" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"><option>Sınav</option><option>Ödev</option><option>Genel Görev</option></select></div>
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">BAŞLIK</label><input type="text" id="tTitle" required placeholder="Vize Sınavı veya Ödev" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></div>
                    <div><label class="block text-[10px] font-medium opacity-60 mb-1">SON TARİH</label><input type="date" id="tDate" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl p-2 text-xs"></div>
                    <button type="submit" class="w-full bg-pink-600 text-white font-medium py-2 rounded-xl text-xs transition mt-2">Kaydet</button>`;
            }
        }

        function closeModal() { document.getElementById('globalModal').classList.add('hidden'); }

        function handleFormSubmit(e) {
            e.preventDefault();
            if (activeModalType === 'lesson') {
                const day = document.getElementById('fDay').value;
                const name = document.getElementById('fName').value;
                const start = document.getElementById('fStart').value;
                const end = document.getElementById('fEnd').value;
                const room = document.getElementById('fRoom').value;

                if (editingLessonId) {
                    const item = db.lessons[selectedDay].find(x => x.id === editingLessonId);
                    if (item) {
                        item.name = name;
                        item.start = start;
                        item.end = end;
                        item.room = room;
                        if (selectedDay !== day) {
                            db.lessons[selectedDay] = db.lessons[selectedDay].filter(x => x.id !== editingLessonId);
                            if (!db.lessons[day]) db.lessons[day] = [];
                            db.lessons[day].push(item);
                        }
                    }
                } else {
                    if (!db.lessons[day]) db.lessons[day] = [];
                    db.lessons[day].push({ id: Date.now(), name, start, end, room, absence: 0 });
                }
                selectedDay = day;
            } else if (activeModalType === 'habit') {
                db.habits.push({ id: Date.now(), name: document.getElementById('hName').value, completed: false });
            } else if (activeModalType === 'note') {
                db.notes.push({ id: Date.now(), title: document.getElementById('nTitle').value, content: document.getElementById('nContent').value });
            } else if (activeModalType === 'todo') {
                db.todos.push({ id: Date.now(), title: document.getElementById('tTitle').value, priority: document.getElementById('tPriority').value, date: document.getElementById('tDate').value, completed: false });
            }
            saveData(); closeModal(); renderCurrentView();
        }

        function deleteItem(type, id) {
            if (type === 'lessons') db.lessons[selectedDay] = db.lessons[selectedDay].filter(x => x.id !== id);
            else db[type] = db[type].filter(x => x.id !== id);
            saveData(); renderCurrentView();
        }

        function toggleHabit(id) {
            const item = db.habits.find(x => x.id === id);
            if (item) { item.completed = !item.completed; saveData(); renderHabits(); }
        }

        function toggleTodo(id) {
            const item = db.todos.find(x => x.id === id);
            if (item) { item.completed = !item.completed; saveData(); renderTodos(); }
        }

        function calculatePassingScore() {
            const vize = parseFloat(document.getElementById('vizeNot').value);
            const oran = parseFloat(document.getElementById('vizeOran').value) / 100;
            const hedef = parseFloat(document.getElementById('gecmeNotu').value);
            const res = document.getElementById('calcResult');

            if (isNaN(vize)) { res.innerText = "Lütfen vize notunu girin."; return; }

            const finalOrani = 1 - oran;
            const gerekenFinal = (hedef - (vize * oran)) / finalOrani;

            if (gerekenFinal <= 0) {
                res.innerHTML = `Tebrikler! Vizeden aldığın puanla zaten dersi geçiyorsun. 🎉`;
            } else if (gerekenFinal > 100) {
                res.innerHTML = `Maalesef bu vizeyle bu hedefi finalde 100 alarak bile yakalamak zor.`;
            } else {
                res.innerHTML = `Geçmek için finalden en az: <strong class="text-pink-500 text-sm">${gerekenFinal.toFixed(1)}</strong> alman gerekiyor!`;
            }
        }

        renderCurrentView();
    </script>
</body>
</html>
