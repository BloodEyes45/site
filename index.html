<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SemaAsistan</title>
    
    <!-- Sevimli Kalp İkonu -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/6723/6723246.png">

        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK'ları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQR3SoBD0fygIJT3PRudDQ-2XjuphOHKE",
            authDomain: "semaasistan-9dca3.firebaseapp.com",
            databaseURL: "https://semaasistan-9dca3-default-rtdb.firebaseio.com",
            projectId: "semaasistan-9dca3",
            storageBucket: "semaasistan-9dca3.firebasestorage.app",
            messagingSenderId: "132361761020",
            appId: "1:132361761020:web:f41854b563182ca44ce779",
            measurementId: "G-E8NYQYPCNR"

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.fbDB = { db, ref, set, onValue };
        if(window.initWhiteboardListeners) window.initWhiteboardListeners();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-28 transition-colors duration-300">

    <!-- Üst Başlık -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-heart text-pink-500"></i>SemaAsistan
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="w-8 h-8 rounded-xl bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-300 transition">
                    <i id="themeIcon" class="fa-solid fa-sun text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- İçerik Alanı -->
    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">
        
        <!-- 1. ÖZET / ANA SAYFA SEKMESİ -->
        <section id="tab-home" class="space-y-4 animate-fade-in">
            <div class="grid grid-cols-1 gap-3">
                <div class="bg-gradient-to-br from-pink-600 to-purple-700 rounded-2xl p-5 text-white shadow-xl shadow-pink-600/20 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold mb-1">Hoş Geldin Sema! 👋</h2>
                        <p id="welcomeDate" class="text-xs text-pink-100 opacity-90">Yükleniyor...</p>
                    </div>
                    <div id="weatherWidget" class="bg-white/15 backdrop-blur-md border border-white/20 rounded-2xl p-3 text-center min-w-[100px]">
                        <i id="weatherIcon" class="fa-solid fa-cloud-sun text-xl mb-1"></i>
                        <div id="weatherTemp" class="text-sm font-bold">--°C</div>
                        <div id="weatherCity" class="text-[10px] font-semibold opacity-90">Soma, Manisa</div>
                    </div>
                </div>
            </div>

            <div id="countdownCard" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm text-center">
                <h4 class="text-xs font-bold uppercase tracking-wider opacity-60 mb-1">Ders Durumu</h4>
                <div id="countdownText" class="text-sm font-bold text-pink-500">Hesaplanıyor...</div>
            </div>

            <div class="space-y-3">
                <h3 class="text-xs font-bold uppercase tracking-wider opacity-60">Bugünün Özeti</h3>
                <div id="todaySummaryList" class="space-y-2"></div>
            </div>
        </section>

        <!-- 2. DERS PROGRAMI SEKMESİ -->
        <section id="tab-schedule" class="space-y-4 hidden animate-fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold">Ders Programı & Devamsızlık</h2>
                <button onclick="openModal('lesson')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Ders Ekle
                </button>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1 hide-scrollbar" id="dayTabs"></div>
            <div id="lessonsList" class="space-y-3"></div>
        </section>

        <!-- 3. ALIŞKANLIKLAR SEKMESİ -->
        <section id="tab-habits" class="space-y-4 hidden animate-fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold">Günlük Alışkanlıklar & Rutinler</h2>
                <button onclick="openModal('habit')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Rutin Ekle
                </button>
            </div>
            <div id="habitsList" class="space-y-3"></div>
        </section>

        <!-- 4. NOTLAR SEKMESİ -->
        <section id="tab-notes" class="space-y-4 hidden animate-fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold">Hızlı Notlar</h2>
                <button onclick="openModal('note')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Not Ekle
                </button>
            </div>
            <div id="notesList" class="space-y-3"></div>
        </section>

        <!-- 5. ÖDEVLER VE SINAVLAR SEKMESİ -->
        <section id="tab-todos" class="space-y-4 hidden animate-fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold">Ödevler & Sınavlar</h2>
                <button onclick="openModal('todo')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-lg shadow-pink-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Görev Ekle
                </button>
            </div>
            <div id="todosList" class="space-y-3"></div>
        </section>

        <!-- 6. GELİŞMİŞ ORTAK CANLI ÇİZİM SEKMESİ (WHITEBOARD) -->
        <section id="tab-draw" class="space-y-3 hidden animate-fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold flex items-center gap-1.5 text-pink-500"><i class="fa-solid fa-paintbrush"></i> Ortak Canlı Tuval</h2>
                <button onclick="clearCanvasFirebase()" class="bg-red-500/20 hover:bg-red-500/30 text-red-500 border border-red-500/30 px-3 py-1 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-trash-can mr-1"></i> Temizle
                </button>
            </div>

            <!-- Araç Çubuğu 1: Araç Seçimi & Şekiller -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-2.5 shadow-sm flex items-center justify-between text-xs">
                <div class="flex gap-1">
                    <button onclick="setTool('pen')" id="tool-pen" class="px-2.5 py-1 rounded-xl font-bold bg-pink-600 text-white transition"><i class="fa-solid fa-pen mr-1"></i> Kalem</button>
                    <button onclick="setTool('rect')" id="tool-rect" class="px-2.5 py-1 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition"><i class="fa-regular fa-square mr-1"></i> Kutu</button>
                    <button onclick="setTool('circle')" id="tool-circle" class="px-2.5 py-1 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition"><i class="fa-regular fa-circle mr-1"></i> Daire</button>
                    <button onclick="setTool('eraser')" id="tool-eraser" class="px-2.5 py-1 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition"><i class="fa-solid fa-eraser mr-1"></i> Silgi</button>
                </div>
            </div>

            <!-- Araç Çubuğu 2: Renkler ve Kalınlık -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-2.5 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <button onclick="setDrawColor('#ec4899')" class="w-5 h-5 rounded-full bg-pink-500 border-2 border-white shadow"></button>
                    <button onclick="setDrawColor('#8b5cf6')" class="w-5 h-5 rounded-full bg-purple-500 border-2 border-white shadow"></button>
                    <button onclick="setDrawColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500 border-2 border-white shadow"></button>
                    <button onclick="setDrawColor('#10b981')" class="w-5 h-5 rounded-full bg-emerald-500 border-2 border-white shadow"></button>
                    <button onclick="setDrawColor('#eab308')" class="w-5 h-5 rounded-full bg-yellow-500 border-2 border-white shadow"></button>
                    <button onclick="setDrawColor('#0f172a')" class="w-5 h-5 rounded-full bg-slate-900 dark:bg-white border-2 border-slate-300 shadow"></button>
                </div>
                <div class="flex items-center gap-2 text-xs">
                    <span class="opacity-60 text-[10px]">Boyut:</span>
                    <input type="range" id="brushSize" min="2" max="20" value="4" class="w-16 accent-pink-600">
                </div>
            </div>

            <!-- Tuval Alanı -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-2 shadow-sm overflow-hidden flex justify-center">
                <canvas id="whiteboardCanvas" width="350" height="390" class="bg-slate-50 dark:bg-slate-950 rounded-xl cursor-crosshair border border-slate-200 dark:border-slate-800"></canvas>
            </div>
        </section>

    </main>

    <!-- Alt Navigasyon Çubuğu -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 py-2 px-1 z-40">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-pink-500 transition">
                <i class="fa-solid fa-house text-sm"></i><span class="text-[9px] font-medium">Özet</span>
            </button>
            <button onclick="switchTab('schedule')" id="nav-schedule" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-calendar-days text-sm"></i><span class="text-[9px] font-medium">Dersler</span>
            </button>
            <button onclick="switchTab('habits')" id="nav-habits" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-bolt text-sm"></i><span class="text-[9px] font-medium">Rutin</span>
            </button>
            <button onclick="switchTab('notes')" id="nav-notes" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-note-sticky text-sm"></i><span class="text-[9px] font-medium">Notlar</span>
            </button>
            <button onclick="switchTab('todos')" id="nav-todos" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-list-check text-sm"></i><span class="text-[9px] font-medium">Görev</span>
            </button>
            <button onclick="switchTab('draw')" id="nav-draw" class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition">
                <i class="fa-solid fa-paintbrush text-sm"></i><span class="text-[9px] font-medium">Çizim</span>
            </button>
        </div>
    </nav>

    <!-- Modal Pencere -->
    <div id="globalModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl text-slate-900 dark:text-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-sm font-bold">Yeni Kayıt</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form id="dynamicForm" onsubmit="handleFormSubmit(event)" class="space-y-3"></form>
        </div>
    </div>

    <!-- JavaScript Mantığı ve Gelişmiş Çizim Motoru -->
    <script>
        const days = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
        let dateToday = new Date().getDay();
        let currentDayIndex = dateToday === 0 ? 6 : dateToday - 1;
        let selectedDay = days[currentDayIndex];
        let currentTab = 'home';
        let activeModalType = '';

        const defaultLessons = {
            "Pazartesi": [
                { id: 101, name: "Yaşlıda Akut ve Kronik Hastalıklar", start: "09:00", end: "12:30", room: "Derslik 7", absence: 0 },
                { id: 102, name: "Sağlık Sosyolojisi", start: "13:30", end: "15:10", room: "Derslik 3", absence: 0 }
            ],
            "Salı": [
                { id: 201, name: "Yaşlıda Beslenme", start: "09:00", end: "10:40", room: "Derslik 3", absence: 0 },
                { id: 202, name: "Fiziksel Rehabilitasyon", start: "10:50", end: "12:30", room: "Derslik 6", absence: 0 },
                { id: 203, name: "Geriatrik Psikiyatri", start: "13:30", end: "15:10", room: "Derslik 6", absence: 0 },
                { id: 204, name: "Sağlık İşletmelerinde Yönetim", start: "15:20", end: "17:00", room: "Amfi C", absence: 0 }
            ],
            "Çarşamba": [
                { id: 301, name: "Çevre Koruma", start: "09:00", end: "10:40", room: "Amfi C", absence: 0 },
                { id: 302, name: "Yaşlıda Akut ve Kronik Hastalıklar", start: "10:50", end: "12:30", room: "Amfi C", absence: 0 }
            ],
            "Perşembe": [], "Cuma": [], "Cumartesi": [], "Pazar": []
        };

        let dbLocal = JSON.parse(localStorage.getItem('sema_asistan_db_v19')) || {
            lessons: defaultLessons,
            habits: [{ id: 1, name: "Su İç (2 Litre)", completed: false }, { id: 2, name: "Günlük Tekrar Yap", completed: false }],
            notes: [], todos: []
        };

        function saveData() { localStorage.setItem('sema_asistan_db_v19', JSON.stringify(dbLocal)); }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark'); html.classList.add('light');
                icon.className = "fa-solid fa-moon text-xs";
            } else {
                html.classList.remove('light'); html.classList.add('dark');
                icon.className = "fa-solid fa-sun text-xs";
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['home', 'schedule', 'habits', 'notes', 'todos', 'draw'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).className = "flex flex-col items-center gap-1 text-pink-500 transition";
            renderCurrentView();
        }

        function renderCurrentView() {
            if (currentTab === 'home') { renderHome(); fetchWeatherAndCity(); updateCountdown(); }
            if (currentTab === 'schedule') { renderDays(); renderLessons(); }
            if (currentTab === 'habits') renderHabits();
            if (currentTab === 'notes') renderNotes();
            if (currentTab === 'todos') renderTodos();
            if (currentTab === 'draw') initWhiteboard();
        }

        function updateCountdown() {
            const now = new Date();
            const todayName = days[currentDayIndex];
            const todayLessons = dbLocal.lessons[todayName] || [];
            const curMinutes = now.getHours() * 60 + now.getMinutes();
            let nextLesson = null, currentLesson = null;

            todayLessons.forEach(l => {
                const [sH, sM] = l.start.split(':').map(Number);
                const [eH, eM] = l.end.split(':').map(Number);
                const sMin = sH * 60 + sM, eMin = eH * 60 + eM;
                if (curMinutes >= sMin && curMinutes <= eMin) currentLesson = l;
                else if (sMin > curMinutes && (!nextLesson || sMin < (parseInt(nextLesson.start.split(':')[0])*60 + parseInt(nextLesson.start.split(':')[1])))) nextLesson = l;
            });

            const textEl = document.getElementById('countdownText');
            if (currentLesson) textEl.innerHTML = `Şu an derste: <strong class="text-pink-500">${currentLesson.name}</strong> (${currentLesson.room || ''})`;
            else if (nextLesson) {
                const [sH, sM] = nextLesson.start.split(':').map(Number);
                const diff = (sH * 60 + sM) - curMinutes;
                textEl.innerHTML = `Sıradaki Ders: <strong class="text-pink-500">${nextLesson.name}</strong> (${Math.floor(diff/60) > 0 ? Math.floor(diff/60) + ' saat ' : ''}${diff%60} dk kaldı)`;
            } else textEl.innerHTML = `Bugün başka ders kalmadı! Dinlenme vakti ✨`;
        }

        async function fetchWeatherAndCity() {
            try {
                navigator.geolocation.getCurrentPosition(async pos => {
                    getWeatherData(pos.coords.latitude, pos.coords.longitude);
                }, () => getWeatherData(39.1903, 27.6156));
            } catch (e) { getWeatherData(39.1903, 27.6156); }
        }

        async function getWeatherData(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await res.json();
                document.getElementById('weatherTemp').innerText = `${Math.round(data.current_weather.temperature)}°C`;
                document.getElementById('weatherCity').innerText = "Soma, Manisa";
            } catch (e) { document.getElementById('weatherTemp').innerText = "20°C"; }
        }

        function renderHome() {
            document.getElementById('welcomeDate').innerText = new Date().toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const container = document.getElementById('todaySummaryList');
            const list = dbLocal.lessons[days[currentDayIndex]] || [];
            container.innerHTML = list.length === 0 ? `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-center text-xs opacity-60">Bugün ders bulunmuyor. 🎉</div>` :
                list.map(i => `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex justify-between items-center shadow-sm"><div><span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-pink-500/10 text-pink-500">${i.start} - ${i.end}</span><h4 class="text-sm font-bold mt-1">${i.name}</h4></div>${i.room?`<span class="text-[10px] opacity-60">${i.room}</span>`:''}</div>`).join('');
        }

        function renderDays() {
            document.getElementById('dayTabs').innerHTML = days.map(d => `<button onclick="selectDay('${d}')" class="px-3.5 py-1.5 rounded-xl text-xs font-medium transition ${d===selectedDay?'bg-pink-600 text-white shadow':'bg-white dark:bg-slate-900 opacity-70 border'}">${d}</button>`).join('');
        }
        function selectDay(d) { selectedDay = d; renderDays(); renderLessons(); }

        function renderLessons() {
            const container = document.getElementById('lessonsList');
            const list = dbLocal.lessons[selectedDay] || [];
            container.innerHTML = list.length === 0 ? `<div class="text-center py-10 opacity-50 text-xs">Bu gün ders yok.</div>` :
                list.map(i => `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-sm space-y-2"><div class="flex justify-between items-center"><div><span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-pink-500/10 text-pink-500">${i.start} - ${i.end}</span><h3 class="text-sm font-bold mt-1">${i.name}</h3></div><button onclick="deleteItem('lessons', ${i.id})" class="opacity-50 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button></div><div class="flex justify-between items-center pt-2 border-t text-[11px]"><span class="opacity-80">Devamsızlık: <strong>${i.absence||0} / 5</strong></span><div class="flex gap-1"><button onclick="updateAbsence(${i.id}, -1)" class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 border">-</button><button onclick="updateAbsence(${i.id}, 1)" class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 border">+</button></div></div></div>`).join('');
        }
        function updateAbsence(id, val) { const it = dbLocal.lessons[selectedDay].find(x => x.id === id); if(it){ it.absence = Math.max(0, (it.absence||0)+val); saveData(); renderLessons(); } }

        function renderHabits() {
            document.getElementById('habitsList').innerHTML = dbLocal.habits.map(h => `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex justify-between items-center shadow-sm"><div class="flex items-center gap-3"><input type="checkbox" ${h.completed?'checked':''} onclick="toggleHabit(${h.id})" class="w-4 h-4 accent-pink-600 rounded"><span class="text-sm font-bold ${h.completed?'line-through opacity-40':''}">${h.name}</span></div><button onclick="deleteItem('habits', ${h.id})" class="opacity-50 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button></div>`).join('');
        }
        function toggleHabit(id) { const h = dbLocal.habits.find(x => x.id === id); if(h){ h.completed = !h.completed; saveData(); renderHabits(); } }

        function renderNotes() {
            document.getElementById('notesList').innerHTML = dbLocal.notes.map(n => `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-1"><div class="flex justify-between items-start"><h3 class="text-sm font-bold">${n.title}</h3><button onclick="deleteItem('notes', ${n.id})" class="opacity-50 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button></div><p class="text-xs opacity-80 whitespace-pre-line">${n.content}</p></div>`).join('');
        }

        function renderTodos() {
            document.getElementById('todosList').innerHTML = dbLocal.todos.map(t => `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex justify-between items-center shadow-sm"><div class="flex items-center gap-3"><input type="checkbox" ${t.completed?'checked':''} onclick="toggleTodo(${t.id})" class="w-4 h-4 accent-pink-600 rounded"><div><div class="flex items-center gap-2"><span class="text-[9px] font-bold px-2 py-0.5 rounded-md border">${t.priority}</span><h3 class="text-sm font-bold ${t.completed?'line-through opacity-40':''}">${t.title}</h3></div><span class="text-[10px] opacity-65">${t.date||''}</span></div></div><button onclick="deleteItem('todos', ${t.id})" class="opacity-50 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button></div>`).join('');
        }
        function toggleTodo(id) { const t = dbLocal.todos.find(x => x.id === id); if(t){ t.completed = !t.completed; saveData(); renderTodos(); } }

        // --- GELİŞMİŞ ORTAK ÇİZİM MOTORU ---
        let canvas, ctx, isDrawing = false, drawColor = '#ec4899', currentTool = 'pen', startX = 0, startY = 0;
        let remoteLines = {};

        function initWhiteboard() {
            canvas = document.getElementById('whiteboardCanvas');
            if(!canvas) return;
            ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            canvas.onmousedown = startAction;
            canvas.onmousemove = moveAction;
            canvas.onmouseup = endAction;
            canvas.onmouseleave = endAction;

            canvas.ontouchstart = (e) => { startAction(e.touches[0]); e.preventDefault(); };
            canvas.ontouchmove = (e) => { moveAction(e.touches[0]); e.preventDefault(); };
            canvas.ontouchend = endAction;

            if(window.fbDB) initWhiteboardListeners();
        }

        function setTool(tool) {
            currentTool = tool;
            ['pen', 'rect', 'circle', 'eraser'].forEach(t => {
                const btn = document.getElementById(`tool-${t}`);
                if(btn) {
                    btn.className = t === tool ? "px-2.5 py-1 rounded-xl font-bold bg-pink-600 text-white transition" : "px-2.5 py-1 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 opacity-70 transition";
                }
            });
        }

        function setDrawColor(col) { drawColor = col; if(currentTool === 'eraser') setTool('pen'); }

        function startAction(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            if(currentTool === 'pen' || currentTool === 'eraser') {
                lastX = startX; lastY = startY;
            }
        }

        let lastX = 0, lastY = 0;
        function moveAction(e) {
            if(!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const size = document.getElementById('brushSize').value;

            if(currentTool === 'pen' || currentTool === 'eraser') {
                const color = currentTool === 'eraser' ? (document.documentElement.classList.contains('dark') ? '#020617' : '#f8fafc') : drawColor;
                drawLineLocally(lastX, lastY, x, y, color, size);

                if(window.fbDB) {
                    const { db, ref, set } = window.fbDB;
                    const id = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                    set(ref(db, 'whiteboard/items/' + id), { type: 'line', x1: lastX, y1: lastY, x2: x, y2: y, color, size });
                }
                lastX = x; lastY = y;
            }
        }

        function endAction(e) {
            if(!isDrawing) return;
            isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            const x = e.changedTouches ? e.changedTouches[0].clientX - rect.left : e.clientX - rect.left;
            const y = e.changedTouches ? e.changedTouches[0].clientY - rect.top : e.clientY - rect.top;
            const size = document.getElementById('brushSize').value;

            if(currentTool === 'rect' || currentTool === 'circle') {
                drawShapeLocally(currentTool, startX, startY, x, y, drawColor, size);
                if(window.fbDB) {
                    const { db, ref, set } = window.fbDB;
                    const id = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                    set(ref(db, 'whiteboard/items/' + id), { type: currentTool, x1: startX, y1: startY, x2: x, y2: y, color: drawColor, size });
                }
            }
        }

        function drawLineLocally(x1, y1, x2, y2, color, size) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = size;
            ctx.stroke();
            ctx.closePath();
        }

        function drawShapeLocally(type, x1, y1, x2, y2, color, size) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = size;
            if(type === 'rect') {
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
            } else if(type === 'circle') {
                let radius = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                ctx.arc(x1, y1, radius, 0, 2 * Math.PI);
                ctx.stroke();
            }
            ctx.closePath();
        }

        window.initWhiteboardListeners = function() {
            if(!window.fbDB) return;
            const { db, ref, onValue } = window.fbDB;

            onValue(ref(db, 'whiteboard/items'), (snapshot) => {
                const data = snapshot.val();
                if(ctx && canvas) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if(data) {
                        Object.values(data).forEach(item => {
                            if(item.type === 'line') {
                                drawLineLocally(item.x1, item.y1, item.x2, item.y2, item.color, item.size);
                            } else if(item.type === 'rect' || item.type === 'circle') {
                                drawShapeLocally(item.type, item.x1, item.y1, item.x2, item.y2, item.color, item.size);
                            }
                        });
                    }
                }
            });

            onValue(ref(db, 'whiteboard/clear'), (snapshot) => {
                if(snapshot.val() && ctx && canvas) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            });
        };

        function clearCanvasFirebase() {
            if(window.fbDB) {
                const { db, ref, set } = window.fbDB;
                set(ref(db, 'whiteboard/items'), null);
                set(ref(db, 'whiteboard/clear'), true);
                setTimeout(() => set(ref(db, 'whiteboard/clear'), false), 500);
            }
        }

        // --- MODAL YÖNETİMİ ---
        function openModal(type) {
            activeModalType = type;
            document.getElementById('globalModal').classList.remove('hidden');
            const form = document.getElementById('dynamicForm');
            if(type === 'lesson') {
                document.getElementById('modalTitle').innerText = 'Yeni Ders Ekle';
                form.innerHTML = `<div><label class="block text-[10px] opacity-60 mb-1">GÜN</label><select id="fDay" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs">${days.map(d=>`<option ${d===selectedDay?'selected':''}>${d}</option>`).join('')}</select></div><div><label class="block text-[10px] opacity-60 mb-1">DERS ADI</label><input type="text" id="fName" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></div><div class="grid grid-cols-2 gap-2"><div><label class="block text-[10px] opacity-60 mb-1">BAŞLANGIÇ</label><input type="time" id="fStart" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></div><div><label class="block text-[10px] opacity-60 mb-1">BİTİŞ</label><input type="time" id="fEnd" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></div></div><div><label class="block text-[10px] opacity-60 mb-1">DERSLİK</label><input type="text" id="fRoom" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></div><button type="submit" class="w-full bg-pink-600 text-white py-2 rounded-xl text-xs mt-2">Kaydet</button>`;
            } else if(type === 'habit') {
                document.getElementById('modalTitle').innerText = 'Yeni Rutin';
                form.innerHTML = `<div><label class="block text-[10px] opacity-60 mb-1">RUTİN</label><input type="text" id="hName" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></div><button type="submit" class="w-full bg-pink-600 text-white py-2 rounded-xl text-xs mt-2">Kaydet</button>`;
            } else if(type === 'note') {
                document.getElementById('modalTitle').innerText = 'Yeni Not';
                form.innerHTML = `<div><label class="block text-[10px] opacity-60 mb-1">BAŞLIK</label><input type="text" id="nTitle" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></div><div><label class="block text-[10px] opacity-60 mb-1">İÇERİK</label><textarea id="nContent" rows="3" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></textarea></div><button type="submit" class="w-full bg-pink-600 text-white py-2 rounded-xl text-xs mt-2">Kaydet</button>`;
            } else if(type === 'todo') {
                document.getElementById('modalTitle').innerText = 'Yeni Görev';
                form.innerHTML = `<div><label class="block text-[10px] opacity-60 mb-1">TÜR</label><select id="tPriority" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"><option>Sınav</option><option>Ödev</option><option>Genel Görev</option></select></div><div><label class="block text-[10px] opacity-60 mb-1">BAŞLIK</label><input type="text" id="tTitle" required class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></div><div><label class="block text-[10px] opacity-60 mb-1">TARİH</label><input type="date" id="tDate" class="w-full bg-slate-100 dark:bg-slate-800 border rounded-xl p-2 text-xs"></div><button type="submit" class="w-full bg-pink-600 text-white py-2 rounded-xl text-xs mt-2">Kaydet</button>`;
            }
        }
        function closeModal() { document.getElementById('globalModal').classList.add('hidden'); }

        function handleFormSubmit(e) {
            e.preventDefault();
            if(activeModalType==='lesson') {
                const d = document.getElementById('fDay').value;
                if(!dbLocal.lessons[d]) dbLocal.lessons[d] = [];
                dbLocal.lessons[d].push({ id: Date.now(), name: document.getElementById('fName').value, start: document.getElementById('fStart').value, end: document.getElementById('fEnd').value, room: document.getElementById('fRoom').value, absence: 0 });
                selectedDay = d;
            } else if(activeModalType==='habit') dbLocal.habits.push({ id: Date.now(), name: document.getElementById('hName').value, completed: false });
            else if(activeModalType==='note') dbLocal.notes.push({ id: Date.now(), title: document.getElementById('nTitle').value, content: document.getElementById('nContent').value });
            else if(activeModalType==='todo') dbLocal.todos.post ? null : dbLocal.todos.push({ id: Date.now(), title: document.getElementById('tTitle').value, priority: document.getElementById('tPriority').value, date: document.getElementById('tDate').value, completed: false });
            saveData(); closeModal(); renderCurrentView();
        }

        function deleteItem(t, id) {
            if(t==='lessons') dbLocal.lessons[selectedDay] = dbLocal.lessons[selectedDay].filter(x=>x.id!==id);
            else dbLocal[t] = dbLocal[t].filter(x=>x.id!==id);
            saveData(); renderCurrentView();
        }

        renderCurrentView();
    </script>
</body>
